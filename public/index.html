<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waldo Chat</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 로그인 / 가입 -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <img src="/icon.svg" alt="" class="login-logo">
      <h1>Waldo Chat</h1>
      <div class="segmented login-tabs" role="tablist">
        <button type="button" role="tab" data-tab="signin" class="on">로그인</button>
        <button type="button" role="tab" data-tab="signup">계정 만들기</button>
      </div>

      <form id="signin-form" class="auth-form">
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">로그인</button>
        <button class="link-btn" type="button" id="forgot-link">비밀번호를 잊으셨나요?</button>
      </form>

      <form id="forgot-form" class="auth-form" hidden>
        <p class="muted small">가입할 때 쓴 이메일을 입력하시면 비밀번호를 다시 설정하는 링크를 보내 드려요.</p>
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <button class="btn" type="submit">재설정 메일 보내기</button>
        <button class="link-btn" type="button" data-back>로그인으로 돌아가기</button>
      </form>

      <form id="reset-form" class="auth-form" hidden>
        <p class="muted small">새로 쓸 비밀번호를 입력해 주세요.</p>
        <label>새 비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></label>
        <label>새 비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn" type="submit">비밀번호 바꾸고 로그인</button>
      </form>

      <p id="login-notice" class="notice" role="status" hidden></p>

      <form id="signup-form" class="auth-form" hidden>
        <label>이름(실명)<input name="name" autocomplete="name" maxlength="40" required placeholder="예: 김월도"></label>
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></label>
        <label>비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn" type="submit">계정 만들기</button>
        <p class="muted small">인증 메일이나 승인 없이 바로 쓰실 수 있어요. 다른 사람에게는 이 이름으로 보여요.</p>
      </form>

      <p id="login-error" class="error" role="alert"></p>
    </div>
  </main>

  <!-- 앱 -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" aria-label="메뉴" title="메뉴">☰</button>
      <div class="brand"><img src="/icon.svg" alt=""><span>Chat</span></div>
      <form id="search-form" class="search" role="search">
        <span aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="채팅 검색" autocomplete="off">
      </form>
      <button id="status-btn" class="status-pill" title="상태 바꾸기"></button>
      <button id="avatar-btn" class="avatar-btn" title="계정"></button>
    </header>

    <nav class="nav" id="nav">
      <button id="new-chat-btn" class="fab">✏️ <span>새 채팅</span></button>
      <ul class="nav-list">
        <li><button class="nav-item" data-view="home"><span class="nav-icon">🏠</span><span class="nav-label">홈</span></button></li>
        <li><button class="nav-item" data-view="mentions"><span class="nav-icon">@</span><span class="nav-label">멘션</span><span class="badge" id="mention-total" hidden></span></button></li>
        <li><button class="nav-item" data-view="starred"><span class="nav-icon">☆</span><span class="nav-label">별표표시됨</span></button></li>
      </ul>
      <div class="nav-section">
        <button class="nav-section-head" data-section="dms"><span class="caret">▾</span> 채팅</button>
        <ul class="nav-list" id="dm-list"></ul>
      </div>
      <div class="nav-section">
        <button class="nav-section-head" data-section="spaces"><span class="caret">▾</span> 스페이스</button>
        <ul class="nav-list" id="space-list"></ul>
        <button class="nav-link" id="browse-btn">🔎 스페이스 찾아보기</button>
      </div>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main"></main>

    <aside class="thread" id="thread" hidden></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="popover-root"></div>

  <dialog id="dialog" class="dialog"></dialog>

  <script src="/vendor/supabase.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
