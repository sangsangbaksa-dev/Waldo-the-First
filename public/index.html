<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waldo Chat</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 로그인 -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <img src="/icon.svg" alt="" class="login-logo">
      <h1>Waldo Chat</h1>
      <p class="muted">구글 계정(Gmail)으로 로그인하고 바로 대화를 시작해.</p>
      <a id="google-login" class="google-btn" href="/auth/google" hidden>
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Google 계정으로 로그인
      </a>
      <p id="google-missing" class="hint" hidden>구글 로그인을 쓰려면 서버에 <code>GOOGLE_CLIENT_ID</code>, <code>GOOGLE_CLIENT_SECRET</code>을 넣어 줘. README에 방법이 있어.</p>
      <form id="dev-login" class="dev-login" hidden>
        <div class="divider"><span>개발용 로그인</span></div>
        <input name="email" type="email" placeholder="이메일" required>
        <input name="name" placeholder="이름" required maxlength="80">
        <button class="btn" type="submit">들어가기</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </main>

  <!-- 앱 -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" aria-label="메뉴" title="메뉴">☰</button>
      <div class="brand"><img src="/icon.svg" alt=""><span>Chat</span></div>
      <form id="search-form" class="search" role="search">
        <span aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="채팅 검색" autocomplete="off">
      </form>
      <button id="status-btn" class="status-pill" title="상태 바꾸기"></button>
      <button id="avatar-btn" class="avatar-btn" title="계정"></button>
    </header>

    <nav class="nav" id="nav">
      <button id="new-chat-btn" class="fab">✏️ <span>새 채팅</span></button>
      <ul class="nav-list">
        <li><button class="nav-item" data-view="home"><span class="nav-icon">🏠</span><span class="nav-label">홈</span></button></li>
        <li><button class="nav-item" data-view="mentions"><span class="nav-icon">@</span><span class="nav-label">멘션</span><span class="badge" id="mention-total" hidden></span></button></li>
        <li><button class="nav-item" data-view="starred"><span class="nav-icon">☆</span><span class="nav-label">별표표시됨</span></button></li>
      </ul>
      <div class="nav-section">
        <button class="nav-section-head" data-section="dms"><span class="caret">▾</span> 채팅</button>
        <ul class="nav-list" id="dm-list"></ul>
      </div>
      <div class="nav-section">
        <button class="nav-section-head" data-section="spaces"><span class="caret">▾</span> 스페이스</button>
        <ul class="nav-list" id="space-list"></ul>
        <button class="nav-link" id="browse-btn">🔎 스페이스 찾아보기</button>
      </div>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main"></main>

    <aside class="thread" id="thread" hidden></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="popover-root"></div>

  <dialog id="dialog" class="dialog"></dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
